<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Pin</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: rgba(30, 30, 30, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .dialog {
        width: 360px;
        padding: 20px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .field { margin-bottom: 10px; }
      .field label {
        display: block;
        font-size: 11px;
        color: rgba(255,255,255,0.5);
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 6px;
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 13px;
        outline: none;
      }
      .field input:focus {
        border-color: rgba(74, 222, 128, 0.5);
      }
      .row { display: flex; gap: 8px; }
      .row .field { flex: 1; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .btn {
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        border: none;
      }
      .btn-cancel {
        background: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.7);
      }
      .btn-cancel:hover { background: rgba(255,255,255,0.15); }
      .btn-create {
        background: rgba(74, 222, 128, 0.3);
        color: #4ade80;
      }
      .btn-create:hover { background: rgba(74, 222, 128, 0.4); }
      .error {
        color: #f87171;
        font-size: 11px;
        margin-top: 4px;
        display: none;
      }
      .error.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="dialog">
      <div class="title">从 URL 创建 Pin</div>
      <div class="field">
        <label>网址</label>
        <input type="url" id="url" placeholder="https://example.com" autofocus />
        <div class="error" id="error">请输入有效的 URL</div>
      </div>
      <div class="row">
        <div class="field">
          <label>标题（可选）</label>
          <input type="text" id="title" placeholder="Web Pin" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>宽度</label>
          <input type="number" id="width" value="400" />
        </div>
        <div class="field">
          <label>高度</label>
          <input type="number" id="height" value="300" />
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-cancel" onclick="cancel()">取消</button>
        <button class="btn btn-create" onclick="submit()">创建</button>
      </div>
    </div>
    <script>
      function invoke(cmd, args) {
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, args);
        }
        return Promise.reject("Tauri not available");
      }

      function cancel() {
        invoke("close_url_input");
      }

      function submit() {
        var urlInput = document.getElementById("url");
        var errorEl = document.getElementById("error");
        var url = urlInput.value.trim();

        if (!url || !url.match(/^https?:\/\/.+/)) {
          errorEl.classList.add("visible");
          urlInput.focus();
          return;
        }
        errorEl.classList.remove("visible");

        var title = document.getElementById("title").value.trim() || null;
        var width = parseFloat(document.getElementById("width").value) || 400;
        var height = parseFloat(document.getElementById("height").value) || 300;

        invoke("create_url_widget", {
          url: url,
          title: title,
          width: width,
          height: height
        }).then(function() {
          invoke("close_url_input");
        }).catch(function(e) {
          errorEl.textContent = e || "创建失败";
          errorEl.classList.add("visible");
        });
      }

      document.getElementById("url").addEventListener("keydown", function(e) {
        if (e.key === "Enter") submit();
        if (e.key === "Escape") cancel();
      });
    </script>
  </body>
</html>
