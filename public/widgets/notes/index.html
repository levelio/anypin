<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Widget</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .widget {
        display: flex; flex-direction: column;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-radius: 12px; width: 240px; height: 180px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .header {
        padding: 8px 12px; font-size: 12px; font-weight: 600;
        color: rgba(255,255,255,0.6); cursor: grab;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      textarea {
        flex: 1; background: transparent; border: none; color: #fff;
        padding: 10px 12px; font-size: 13px; resize: none; outline: none;
        font-family: inherit; line-height: 1.5;
      }
      textarea::placeholder { color: rgba(255,255,255,0.3); }
      .footer {
        padding: 4px 12px; font-size: 10px;
        color: rgba(255,255,255,0.3); text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="header" data-tauri-drag-region>便签</div>
      <textarea id="note" placeholder="输入内容..." oninput="save()"></textarea>
      <div class="footer" id="status">自动保存</div>
    </div>
    <script>
      var label = new URLSearchParams(window.location.search).get("label") || "";
      var noteEl = document.getElementById("note");
      var statusEl = document.getElementById("status");
      var saveTimeout = null;

      // Load saved content
      if (window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__.invoke("get_widget_store", { label: label, key: "note" })
          .then(function(val) { if (val) noteEl.value = val; })
          .catch(function() {});
      }

      function save() {
        clearTimeout(saveTimeout);
        statusEl.textContent = "编辑中...";
        saveTimeout = setTimeout(function() {
          if (window.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__.invoke("set_widget_store", {
              label: label, key: "note", value: noteEl.value
            }).then(function() { statusEl.textContent = "已保存"; });
          }
        }, 500);
      }
    </script>
  </body>
</html>
