<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Widget</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .widget {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 12px;
        min-width: 180px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .time {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
      }
      .date {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 4px;
      }
      .close-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .widget:hover .close-btn { opacity: 1; }
      .close-btn:hover { background: rgba(248, 113, 113, 0.8); color: #fff; }
    </style>
  </head>
  <body>
    <div class="widget" data-tauri-drag-region>
      <div class="close-btn" onclick="closeWidget()">&times;</div>
      <div class="time" id="time" data-tauri-drag-region>--:--:--</div>
      <div class="date" id="date" data-tauri-drag-region>----</div>
    </div>

    <script>
      var label = new URLSearchParams(window.location.search).get("label") || "";

      function invoke(cmd, args) {
        if (window.__TAURI_INTERNALS__) {
          return window.__TAURI_INTERNALS__.invoke(cmd, args);
        }
        return Promise.reject("Tauri not available");
      }

      function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, "0");
        var m = String(now.getMinutes()).padStart(2, "0");
        var s = String(now.getSeconds()).padStart(2, "0");
        document.getElementById("time").textContent = h + ":" + m + ":" + s;

        var year = now.getFullYear();
        var month = String(now.getMonth() + 1).padStart(2, "0");
        var day = String(now.getDate()).padStart(2, "0");
        var weekDays = ["日", "一", "二", "三", "四", "五", "六"];
        document.getElementById("date").textContent = year + "." + month + "." + day + " 星期" + weekDays[now.getDay()];
      }

      function closeWidget() {
        invoke("destroy_widget", { label: label });
      }

      updateClock();
      setInterval(updateClock, 1000);

      document.addEventListener("contextmenu", function(e) {
        e.preventDefault();
        invoke("show_widget_context_menu", { label: label });
      });
    </script>
  </body>
</html>
